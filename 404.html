<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pausely</title>
<meta name="apple-itunes-app" content="app-id=6759973158">
<link rel="icon" href="/icon.png">
<style>
:root { --bg: #F6F6F4; --raised: #FFFFFF; --line: rgba(0,0,0,.08); --ink: #0B0B0D; --ink2: #5C5C66; --accent: #34D399; --on-accent: #04261A; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #09090B; --raised: #131316; --line: rgba(255,255,255,.08); --ink: #FAFAFA; --ink2: #A1A1AA; }
}
:root[data-theme="dark"] { --bg: #09090B; --raised: #131316; --line: rgba(255,255,255,.08); --ink: #FAFAFA; --ink2: #A1A1AA; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 26px; padding: 36px 28px; max-width: 440px; width: 100%; text-align: center; }
img.icon { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 18px; }
h1 { font: 700 28px/1.15 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; margin-bottom: 10px; }
p { color: var(--ink2); margin-bottom: 24px; }
.button { display: inline-block; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; padding: 15px 26px; border-radius: 999px; }
.home { display: block; margin-top: 18px; color: var(--ink2); font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="/icon.png" alt="">
  <h1 id="title">Page not found</h1>
  <p id="text">This page doesn't exist. Pausely reminds you before every subscription renews and asks one question: keep it or cancel it?</p>
  <a class="button" href="https://apps.apple.com/app/pausely/id6759973158">Get Pausely on the App Store</a>
  <a class="home" href="/">pausely.pro</a>
</div>
<script>
  // pausely.pro/r/CODE and /referral?code=CODE open the app when it's installed (universal links).
  // Without the app, the link lands here.
  var path = location.pathname.toLowerCase();
  if (/^\/r\/[a-z0-9]+\/?$/.test(path) || (path === "/referral" && /[?&]code=/.test(location.search))) {
    document.getElementById("title").textContent = "A friend shared Pausely with you";
    document.getElementById("text").textContent = "Pausely reminds you before every subscription renews, asks one question, keep it or cancel it, and keeps a receipt of what you saved. Install it, then open this link again.";
    document.title = "Pausely: a friend shared it with you";
  }
</script>
</body>
</html>
